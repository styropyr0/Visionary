<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visionary - Observability Metrics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0a0a0f;
            --bg-panel: #121218;
            --bg-hover: #1a1a24;
            --accent-purple: #8b5cf6;
            --accent-violet: #a78bfa;
            --accent-indigo: #6366f1;
            --text-primary: #f0f0f4;
            --text-secondary: #a0a0a8;
            --border-color: #2a2a36;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #1a1527 50%, var(--bg-dark) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background elements */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.1) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
            animation: drift 15s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -50%;
            left: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
            animation: drift-reverse 20s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, 50px); }
        }

        @keyframes drift-reverse {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, -50px); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* Header */
        header {
            margin-bottom: 50px;
            text-align: center;
            animation: fadeInDown 0.6s ease-out;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header h1 {
            font-family: 'Manrope', sans-serif;
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-violet) 0%, var(--accent-purple) 50%, var(--accent-indigo) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            letter-spacing: -1px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        /* Main Grid */
        .main-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 28px;
            margin-bottom: 40px;
            animation: fadeInUp 0.6s ease-out 0.1s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 28px;
            border-radius: 16px;
            height: fit-content;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: sticky;
            top: 40px;
        }

        .sidebar:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.15);
        }

        .sidebar h2 {
            font-family: 'Manrope', sans-serif;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar h2::before {
            content: '';
            width: 3px;
            height: 16px;
            background: linear-gradient(180deg, var(--accent-purple), var(--accent-indigo));
            border-radius: 2px;
        }

        .source-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .source-list li {
            padding: 12px 16px;
            background: var(--bg-hover);
            border: 1px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            position: relative;
            overflow: hidden;
        }

        .source-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 3px;
            background: linear-gradient(180deg, var(--accent-purple), var(--accent-violet));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .source-list li:hover {
            background: var(--bg-dark);
            border-color: var(--accent-purple);
            color: var(--text-primary);
        }

        .source-list li.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(99, 102, 241, 0.1));
            border-color: var(--accent-purple);
            color: var(--accent-violet);
            font-weight: 600;
        }

        .source-list li.active::before {
            opacity: 1;
        }

        /* Content Area */
        .content {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        /* Panels */
        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 32px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .panel:hover {
            border-color: var(--accent-purple);
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.1);
        }

        .panel h2 {
            font-family: 'Manrope', sans-serif;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 24px;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel h2::before {
            content: '';
            width: 2px;
            height: 18px;
            background: linear-gradient(180deg, var(--accent-purple), var(--accent-indigo));
            border-radius: 1px;
        }

        /* Forms */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-dark);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        input[type="text"]::placeholder,
        select option {
            color: var(--text-secondary);
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--accent-purple);
            background: var(--bg-dark);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        /* Button Group */
        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 28px;
        }

        button {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button.primary {
            background: linear-gradient(135deg, var(--accent-purple) 0%, var(--accent-indigo) 100%);
            color: white;
            border: none;
            position: relative;
            overflow: hidden;
        }

        button.primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button.primary:hover::before {
            left: 100%;
        }

        button.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(139, 92, 246, 0.3);
        }

        button.secondary {
            background: var(--bg-dark);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        button.secondary:hover {
            background: var(--bg-hover);
            border-color: var(--accent-purple);
            color: var(--text-primary);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Results Panel */
        .results-panel {
            display: none;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .results-panel.show {
            display: block;
        }

        /* Metrics Table */
        .metrics-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .metrics-table th {
            background: var(--bg-dark);
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.4px;
            font-size: 12px;
        }

        .metrics-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .metrics-table tr:hover {
            background: var(--bg-hover);
        }

        .metric-name {
            color: var(--accent-violet);
            font-weight: 500;
        }

        .metric-value {
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-weight: 600;
            color: var(--accent-purple);
            letter-spacing: 0.2px;
        }

        .metric-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
        }

        /* Aggregates */
        .aggregate-section {
            margin-top: 28px;
            padding-top: 28px;
            border-top: 1px solid var(--border-color);
        }

        .aggregate-section h3 {
            font-family: 'Manrope', sans-serif;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .aggregate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .aggregate-item {
            background: var(--bg-dark);
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .aggregate-item:hover {
            border-color: var(--accent-purple);
            background: var(--bg-hover);
        }

        .aggregate-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 5;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .aggregate-value {
            font-weight: 700;
            color: var(--accent-violet);
            font-family: 'Monaco', 'Menlo', 'Courier New', monospace;
            font-size: 16px;
            letter-spacing: 0.2px;
        }

        /* Status Messages */
        .error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(220, 38, 38, 0.05));
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 16px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            margin-bottom: 20px;
        }

        .error.show {
            display: block;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .spinner {
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--accent-purple);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 56px;
            margin-bottom: 20px;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 14px;
            line-height: 1.6;
        }

        /* Footer */
        footer {
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid var(--border-color);
            letter-spacing: 0.3px;
        }

        footer a {
            color: var(--accent-purple);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        footer a:hover {
            color: var(--accent-violet);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 24px 16px;
            }

            header h1 {
                font-size: 36px;
            }

            .main-grid {
                gap: 20px;
            }

            .sidebar {
                padding: 20px;
            }

            .panel {
                padding: 24px;
            }

            .button-group {
                flex-direction: column;
            }

            .aggregate-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Visionary</h1>
            <p>Advanced Observability Metrics Platform</p>
        </header>

        <div class="main-grid">
            <aside class="sidebar">
                <h2>Data Sources</h2>
                <ul class="source-list" id="sourceList">
                    <li class="loading">
                        <div class="spinner"></div>
                    </li>
                </ul>
            </aside>

            <div class="content">
                <div class="error" id="error"></div>

                <div class="panel">
                    <h2>Query Builder</h2>
                    <form id="queryForm">
                        <div class="form-group">
                            <label for="metricName">Metric Name</label>
                            <input type="text" id="metricName" placeholder="e.g., system.cpu_usage, postgres.active_connections">
                        </div>

                        <div class="form-group">
                            <label for="namePattern">Name Pattern (Regex)</label>
                            <input type="text" id="namePattern" placeholder="e.g., system.* or .*usage">
                        </div>

                        <div class="form-group">
                            <label for="aggregation">Aggregation Function</label>
                            <select id="aggregation">
                                <option value="">-- None --</option>
                                <option value="sum">Sum</option>
                                <option value="avg">Average</option>
                                <option value="min">Minimum</option>
                                <option value="max">Maximum</option>
                                <option value="median">Median</option>
                                <option value="stddev">Standard Deviation</option>
                                <option value="count">Count</option>
                                <option value="p50">Percentile 50</option>
                                <option value="p95">Percentile 95</option>
                                <option value="p99">Percentile 99</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="limit">Limit Results</label>
                            <input type="text" id="limit" placeholder="e.g., 10 (optional)" value="">
                        </div>

                        <div class="button-group">
                            <button type="submit" class="primary">Execute Query</button>
                            <button type="reset" class="secondary">Clear</button>
                        </div>
                    </form>
                </div>

                <div class="panel results-panel" id="resultsPanel">
                    <h2>Results</h2>
                    <div id="resultsContent"></div>
                </div>
            </div>
        </div>

        <footer>
            <p>Visionary &copy; 2026 — Observability for Developers</p>
        </footer>
    </div>

    <script>
        const sourceList = document.getElementById('sourceList');
        const queryForm = document.getElementById('queryForm');
        const resultsPanel = document.getElementById('resultsPanel');
        const resultsContent = document.getElementById('resultsContent');
        const errorDiv = document.getElementById('error');
        let selectedSource = null;

        // Load data sources
        async function loadSources() {
            try {
                const response = await fetch('/api/visionary/sources');
                const data = await response.json();
                
                sourceList.innerHTML = '';
                data.sources.forEach((source, index) => {
                    const li = document.createElement('li');
                    li.textContent = source;
                    li.className = index === 0 ? 'active' : '';
                    li.addEventListener('click', () => selectSource(source, li));
                    sourceList.appendChild(li);
                });

                if (data.sources.length > 0) {
                    selectedSource = data.sources[0];
                }
            } catch (e) {
                showError('Failed to load data sources');
            }
        }

        function selectSource(source, element) {
            document.querySelectorAll('.source-list li').forEach(li => li.classList.remove('active'));
            element.classList.add('active');
            selectedSource = source;
        }

        // Execute query
        queryForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!selectedSource) {
                showError('Please select a data source');
                return;
            }

            const metricName = document.getElementById('metricName').value.trim();
            const namePattern = document.getElementById('namePattern').value.trim();
            const aggregation = document.getElementById('aggregation').value;
            const limit = parseInt(document.getElementById('limit').value) || undefined;

            if (!metricName && !namePattern) {
                showError('Please enter either a metric name or name pattern');
                return;
            }

            showLoading();
            errorDiv.classList.remove('show');

            try {
                const queryBody = {
                    source: selectedSource,
                    filters: {}
                };

                if (metricName) {
                    queryBody.filters.name = metricName;
                }
                if (namePattern) {
                    queryBody.filters.name_pattern = namePattern;
                }
                if (aggregation) {
                    queryBody.aggregation = aggregation;
                }
                if (limit) {
                    queryBody.limit = limit;
                }

                const response = await fetch('/api/visionary/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(queryBody)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || 'Query failed');
                }

                displayResults(result);
                resultsPanel.classList.add('show');
            } catch (error) {
                showError(error.message);
                resultsPanel.classList.remove('show');
            }
        });

        function displayResults(data) {
            resultsContent.innerHTML = '';

            if (!data.metrics || data.metrics.length === 0) {
                resultsContent.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📊</div>
                        <p>No metrics found matching your query</p>
                    </div>
                `;
                return;
            }

            // Metrics table
            let html = `
                <table class="metrics-table">
                    <thead>
                        <tr>
                            <th>Metric Name</th>
                            <th>Value</th>
                            <th>Labels</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            data.metrics.forEach(metric => {
                const labelsStr = metric.labels && Object.keys(metric.labels).length > 0
                    ? Object.entries(metric.labels).map(([k, v]) => `${k}=${v}`).join(', ')
                    : '—';
                html += `
                    <tr>
                        <td><span class="metric-name">${metric.name}</span></td>
                        <td><span class="metric-value">${formatValue(metric.value)}</span></td>
                        <td><span class="metric-label">${labelsStr}</span></td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            // Aggregates
            if (data.aggregates) {
                html += `
                    <div class="aggregate-section">
                        <h3>Aggregated Results</h3>
                        <div class="aggregate-grid">
                `;

                Object.entries(data.aggregates).forEach(([key, value]) => {
                    html += `
                        <div class="aggregate-item">
                            <div class="aggregate-label">${key}</div>
                            <div class="aggregate-value">${formatValue(value)}</div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            }

            resultsContent.innerHTML = html;
        }

        function formatValue(value) {
            if (typeof value === 'number') {
                return value.toLocaleString(undefined, {
                    maximumFractionDigits: 2,
                    minimumFractionDigits: 0
                });
            }
            return String(value);
        }

        function showLoading() {
            resultsContent.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Executing query...</p>
                </div>
            `;
        }

        function showError(message) {
            errorDiv.textContent = '⚠ ' + message;
            errorDiv.classList.add('show');
        }

        // Initialize
        loadSources();
    </script>
</body>
</html>
