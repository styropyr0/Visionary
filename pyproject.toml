[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionary"
version = "0.1.0"
description = "OpenAPI-first, framework-agnostic observability backend library"
readme = "Readme.md"
license = {text = "MIT"}
authors = [{name = "Visionary Contributors"}]
requires-python = ">=3.8"
keywords = ["observability", "metrics", "monitoring", "dashboard", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "Django>=4.0",
    "djangorestframework>=3.14",
    "docker>=7.0",
    "kubernetes>=33.0",
    "prometheus-client>=0.18",
    "psycopg2>=2.9",
    "PyMySQL>=1.1",
    "redis>=5.0",
    "elasticsearch>=9.0",
    "influxdb>=5.3",
    "psutil>=5.9",
    "pyvmomi>=7.0",
    "openstacksdk>=4.0",
    "proxmoxer>=2.2",
    "requests>=2.28",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.5",
    "pytest-cov>=4.1",
    "black>=23.7",
    "ruff>=0.0.285",
    "mypy>=1.4",
    "sphinx>=7.1",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/visionary"
"Documentation" = "https://visionary.readthedocs.io"
"Source Code" = "https://github.com/yourusername/visionary"
"Issue Tracker" = "https://github.com/yourusername/visionary/issues"

[tool.setuptools]
packages = ["core", "django_app"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
